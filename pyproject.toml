[project]
name = "project-two-building-with-apis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-tailwind-cli>=4.8.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pokedex.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/*", "prototypes", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
