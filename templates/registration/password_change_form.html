{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Change password</h1>
    <form method="post" action="{% url 'password_change' %}">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-full mt-4">Change password</button>
    </form>
    <p class="text-sm mt-2"><a class="link" href="{% url 'accounts:account' %}">Back to account</a></p>
  </div>
</div>
{% endblock %}
