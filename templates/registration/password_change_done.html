{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Password changed</h1>
    <p>Your password was updated. You are still signed in.</p>
    <div class="card-actions">
      <a class="btn btn-primary" href="{% url 'accounts:account' %}">Back to account</a>
    </div>
  </div>
</div>
{% endblock %}
