{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Sign in</h1>
    {% if next and not user.is_authenticated %}
      <p class="text-sm opacity-70">Please sign in to see that page.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full mt-4">Sign in</button>
    </form>
    <p class="text-sm mt-2">New here? <a class="link" href="{% url 'accounts:signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
